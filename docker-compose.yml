services:
  db:
    build: ./db
    image: pgrouting-yokohama-db:17-3.5
    environment:
      POSTGRES_DB: routing
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing -d routing"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot job: download -> clip -> osm2pgrouting -> post-processing.
  # Exits 0 immediately when the current BBOX has already been imported.
  importer:
    build: ./importer
    image: pgrouting-yokohama-importer:1.0
    environment:
      BBOX: ${BBOX}
      OSM_PBF_URL: ${OSM_PBF_URL}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: routing
      PGUSER: routing
      PGPASSWORD: routing
    volumes:
      - osm_cache:/data
      - ./sql:/sql:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    image: pgrouting-yokohama-web:1.0
    environment:
      DATABASE_URL: postgresql://routing:routing@db:5432/routing
      BBOX: ${BBOX}
      PUBLIC_URL: http://localhost:${WEB_PORT:-8080}
    volumes:
      - ./sql:/app/sql:ro
    ports:
      - "${WEB_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  osm_cache:
